name: Build Espresso Blok APK

on:
  push:
    paths:
      - 'espresso-blok-app/**'
      - '.github/workflows/build-espresso-blok-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ESPRESSO_KEYSTORE_BASE64: ${{ secrets.ESPRESSO_KEYSTORE_BASE64 }}
      ESPRESSO_KEYSTORE_PASSWORD: ${{ secrets.ESPRESSO_KEYSTORE_PASSWORD }}
      ESPRESSO_KEY_ALIAS: ${{ secrets.ESPRESSO_KEY_ALIAS }}
      ESPRESSO_KEY_PASSWORD: ${{ secrets.ESPRESSO_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: espresso-blok-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show versions
        run: |
          node -v
          npm -v
          java -version

      - name: Install npm dependencies
        run: |
          set +e
          OUT=$(npm install 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::npm install failed: $ESC"
          fi
          exit $CODE

      - name: Sync Capacitor Android project
        run: |
          set +e
          OUT=$(npx cap sync android 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::cap sync failed: $ESC"
          fi
          exit $CODE

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: espresso-blok-app/android
        run: |
          set +e
          OUT=$(./gradlew assembleDebug --no-daemon 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::gradle build failed: $ESC"
          fi
          exit $CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: espresso-blok-debug-apk
          path: espresso-blok-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ env.ESPRESSO_KEYSTORE_BASE64 != '' }}
        working-directory: espresso-blok-app/android/app
        run: echo "$ESPRESSO_KEYSTORE_BASE64" | base64 -d > espresso-blok-release.keystore

      - name: Build signed release AAB + APK
        if: ${{ env.ESPRESSO_KEYSTORE_BASE64 != '' }}
        env:
          ESPRESSO_KEYSTORE_PATH: app/espresso-blok-release.keystore
        working-directory: espresso-blok-app/android
        run: |
          set +e
          OUT=$(./gradlew bundleRelease assembleRelease --no-daemon 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::release build failed: $ESC"
          fi
          exit $CODE

      - name: Upload signed release artifacts
        if: ${{ env.ESPRESSO_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: espresso-blok-release
          path: |
            espresso-blok-app/android/app/build/outputs/bundle/release/app-release.aab
            espresso-blok-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit builds back to repo (so they can be fetched outside Actions storage)
        working-directory: .
        run: |
          mkdir -p dist
          cp espresso-blok-app/android/app/build/outputs/apk/debug/app-debug.apk dist/espresso-blok-debug.apk
          if [ -n "$ESPRESSO_KEYSTORE_BASE64" ]; then
            cp espresso-blok-app/android/app/build/outputs/bundle/release/app-release.aab dist/espresso-blok-release.aab
            cp espresso-blok-app/android/app/build/outputs/apk/release/app-release.apk dist/espresso-blok-release.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "Derlenen dosyalar degismedi, commit atlaniyor."
          else
            git commit -m "dist: derlenen APK/AAB dosyalari guncellendi [skip ci]"
            git push
          fi
