name: Build Espresso Blok APK

on:
  push:
    paths:
      - 'espresso-blok-app/**'
      - '.github/workflows/build-espresso-blok-apk.yml'
  workflow_dispatch: {}

# Release oluşturmak için yazma izni gerekiyor. Derlenen dosyalar artık repoya commit edilmiyor.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ESPRESSO_KEYSTORE_BASE64: ${{ secrets.ESPRESSO_KEYSTORE_BASE64 }}
      ESPRESSO_KEYSTORE_PASSWORD: ${{ secrets.ESPRESSO_KEYSTORE_PASSWORD }}
      ESPRESSO_KEY_ALIAS: ${{ secrets.ESPRESSO_KEY_ALIAS }}
      ESPRESSO_KEY_PASSWORD: ${{ secrets.ESPRESSO_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: espresso-blok-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: espresso-blok-app/package-lock.json

      - name: Show versions
        run: |
          node -v
          npm -v
          java -version

      # package-lock.json sayesinde her derleme aynı paket sürümleriyle yapılır.
      - name: Install npm dependencies
        run: |
          set +e
          OUT=$(npm ci 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::npm ci failed: $ESC"
          fi
          exit $CODE

      # Aynı bloklardan oluşan iki tarif, tanımsız parça ya da hatalı bardak bilgisi varsa derleme durur.
      - name: Tarif verisini denetle
        run: node scripts/check-recipes.mjs

      - name: Sync Capacitor Android project
        run: |
          set +e
          OUT=$(npx cap sync android 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::cap sync failed: $ESC"
          fi
          exit $CODE

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: espresso-blok-app/android
        run: |
          set +e
          OUT=$(./gradlew assembleDebug --no-daemon 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::gradle build failed: $ESC"
          fi
          exit $CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: espresso-blok-debug-apk
          path: espresso-blok-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ env.ESPRESSO_KEYSTORE_BASE64 != '' }}
        working-directory: espresso-blok-app/android/app
        run: echo "$ESPRESSO_KEYSTORE_BASE64" | base64 -d > espresso-blok-release.keystore

      - name: Build signed release AAB + APK
        if: ${{ env.ESPRESSO_KEYSTORE_BASE64 != '' }}
        env:
          ESPRESSO_KEYSTORE_PATH: espresso-blok-release.keystore
          ESPRESSO_VERSION_CODE: ${{ github.run_number }}
        working-directory: espresso-blok-app/android
        run: |
          set +e
          OUT=$(./gradlew bundleRelease assembleRelease --no-daemon 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            ESC=$(echo "$OUT" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::release build failed: $ESC"
          fi
          exit $CODE

      - name: Upload signed release artifacts
        if: ${{ env.ESPRESSO_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: espresso-blok-release
          path: |
            espresso-blok-app/android/app/build/outputs/bundle/release/app-release.aab
            espresso-blok-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Eskiden derlenen dosyalar dist/ klasörüne commit ediliyordu; bu repoyu şişiriyor ve
      # başka dallardan gelen derlemeler main'deki dosyaların üzerine yazıyordu.
      # Artık yalnızca main dalındaki derleme "son-derleme" adlı GitHub Release'e yüklenir.
      # Sabit indirme adresi: https://github.com/<kullanıcı>/<repo>/releases/tag/son-derleme
      - name: Son derlemeyi GitHub Releases'e yükle (yalnızca main)
        if: ${{ github.ref == 'refs/heads/main' && env.ESPRESSO_KEYSTORE_BASE64 != '' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p /tmp/rel
          cp espresso-blok-app/android/app/build/outputs/apk/debug/app-debug.apk /tmp/rel/espresso-blok-debug.apk
          cp espresso-blok-app/android/app/build/outputs/bundle/release/app-release.aab /tmp/rel/espresso-blok-release.aab
          cp espresso-blok-app/android/app/build/outputs/apk/release/app-release.apk /tmp/rel/espresso-blok-release.apk
          gh release delete son-derleme --yes --cleanup-tag || true
          gh release create son-derleme /tmp/rel/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Son derleme (versionCode ${{ github.run_number }})" \
            --notes "main dalının en son otomatik derlemesi. Commit: $GITHUB_SHA. Play Console'a yüklenecek dosya: espresso-blok-release.aab"
