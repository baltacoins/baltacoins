name: Deploy Privacy Policy Page

on:
  push:
    paths:
      - 'privacy/**'
      - '.github/workflows/deploy-privacy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site with privacy/ subpath
        run: |
          mkdir -p pages-dist/privacy
          cp -r privacy/. pages-dist/privacy/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages-dist'
      - id: deployment
        uses: actions/deploy-pages@v4
